# Copy to values.yaml (or override with --set / -f) and fill in real values.
# Never commit real values.

replicaCount: 3
imagePullPolicy: IfNotPresent

# Images from Docker Hub (override with --set images.user=...)
images:
  user: minac4/eshtry-mny-user:0.1.0-dev
  product: minac4/eshtry-mny-product:0.1.0-dev
  cart: minac4/eshtry-mny-cart:0.1.0-dev
  frontend: minac4/eshtry-mny-frontend:0.1.0-dev

# ConfigMap values
mongoCluster: "CHANGE_ME"
mongoDbname: "eshtry_mny"
frontendOrigin: "https://eshtry-mny.local"

# Secrets — pass real values with --set secrets.* or a -f override file.
# Never commit real credentials here.
secrets:
  mongoUsername: "CHANGE_ME"
  mongoPassword: "CHANGE_ME"
  accessToken: "CHANGE_ME"

# ====================== Ingress ======================
ingress:
  enabled: true
  className: nginx
  host: eshtry-mny.local
  tls:
    enabled: true
    secretName: eshtry-mny-tls