# Homelab values (see docs/01-ADR-0001-homelab-adaptation.md).
# Secrets are NOT stored here: pass them with an untracked values file, e.g.
#   helm upgrade --install eshtry-mny ./eshtry-mny -n eshtry-mny --create-namespace -f values-secret.yaml
# values-secret.yaml is git-ignored and is populated by Jenkins from credentials.

replicaCount: 1
imagePullPolicy: IfNotPresent
# Images from the operator's Harbor registry (override with --set images.user=...)
images:
  user: 192.168.1.8:30082/eshtry-mny/eshtry-mny-user@sha256:c1d943fba19f887ca2a9432217d2d44f51474a5594f97ab872047270a70f2e94
  product: 192.168.1.8:30082/eshtry-mny/eshtry-mny-product@sha256:c84bc2dc9c71275ba95fe20ed7f290b5b62b1d999a968af11b1ff547ec40460f
  cart: 192.168.1.8:30082/eshtry-mny/eshtry-mny-cart@sha256:cbd6d1eef157ace6283030d96e78266f6cf331b79fad78ca4cbdab7318b8b422
  frontend: 192.168.1.8:30082/eshtry-mny/eshtry-mny-frontend@sha256:395174a216af59b7e50f692e70dcff4b288dd0fc7d7bdcf30dfc9467123cd5c3
# ConfigMap values
mongoCluster: "" # unused when MONGO_URI is set (in-cluster MongoDB)
mongoDbname: "eshtry_mny"
frontendOrigin: "http://eshtry-mny.192.168.1.8.nip.io"
nodeEnv: "production"
# Local secrets backend (ADR D1). Values supplied out-of-band; never committed.
# `create` stays false for GitOps: Argo CD must not render/prune the Secrets,
# which are created out-of-band (bootstrap / Jenkins). See ci/scripts/create-secrets.sh.
secrets:
  create: false
  mongoUsername: ""
  mongoPassword: ""
  mongoUri: ""
  accessToken: ""
  harborUsername: ""
  harborPassword: ""
registry:
  host: "192.168.1.8:30082"
  pullSecretName: "harbor-creds"
# In-cluster MongoDB (ADR D7). No cloud database.
mongodb:
  enabled: true
  image: "mongo:7.0"
  storageClass: "local-path"
  storageSize: "2Gi"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
# External Secrets (AWS/Vault) are disabled for this homelab (ADR D1).
externalSecrets:
  enabled: false
# Right-sized for the homelab (docs/01-capacity-budget.md).
hpa:
  minReplicas: 1
  maxReplicas: 3
  cpuUtilization: 70
  memoryUtilization: 80
# PodDisruptionBudget: maxUnavailable keeps single-replica rollouts/drains possible.
pdb:
  maxUnavailable: 1

# Image signature admission (Phase 5/8). Roll out Audit first, then Enforce.
kyverno:
  verifyImages:
    enabled: true
    action: Audit
# ====================== Ingress ======================
ingress:
  enabled: true
  className: traefik
  host: eshtry-mny.192.168.1.8.nip.io
# Runtime UIDs matching the container images (ADR: numeric uid required for runAsNonRoot)
security:
  backend:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
  frontend:
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
  mongodb:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
