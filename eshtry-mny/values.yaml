replicaCount: 3
imagePullPolicy: IfNotPresent

# Images from Docker Hub (override with --set images.user=...)
images:
  user: minac4/eshtry-mny-user:0.1.0-dev
  product: minac4/eshtry-mny-product:0.1.0-dev
  cart: minac4/eshtry-mny-cart:0.1.0-dev
  frontend: minac4/eshtry-mny-frontend:0.1.0-dev

# ConfigMap values
mongoCluster: "CHANGE_ME"
mongoDbname: "eshtry_mny"
frontendOrigin: "https://eshtry-mny.local"

# Service-specific values
services:
  user:
    name: user-service
    image: "{{ .Values.images.user }}"
    port: 9001
  product:
    name: product-service
    image: "{{ .Values.images.product }}"
    port: 9000
  cart:
    name: cart-service
    image: "{{ .Values.images.cart }}"
    port: 9003
  frontend:
    name: frontend
    image: "{{ .Values.images.frontend }}"
    port: 8080

# Secrets are now managed by External Secrets Operator (AWS Secrets Manager).
# See eshtry-mny/templates/externalsecret.yaml for the mapping.
# Do NOT set secrets via --set secrets.* anymore.

# ====================== Ingress ======================
ingress:
  enabled: true
  className: nginx
  host: eshtry-mny.local
  tls:
    enabled: true
    secretName: eshtry-mny-tls
