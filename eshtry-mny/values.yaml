# Homelab values (see docs/01-ADR-0001-homelab-adaptation.md).
# Secrets are NOT stored here: pass them with an untracked values file, e.g.
#   helm upgrade --install eshtry-mny ./eshtry-mny -n eshtry-mny --create-namespace -f values-secret.yaml
# values-secret.yaml is git-ignored and is populated by Jenkins from credentials.

replicaCount: 1
imagePullPolicy: IfNotPresent
# Images from the operator's Harbor registry (override with --set images.user=...)
images:
  user: 192.168.1.8:30082/eshtry-mny/eshtry-mny-user@sha256:5f841b767b4a8f0a31924680bc448be6ad6962d5d539f74d05f776014cf261a6
  product: 192.168.1.8:30082/eshtry-mny/eshtry-mny-product@sha256:40f6644079d4e12ed0cc8fd5afc6f8953af4fafda2e4c6e52de0162194e1309a
  cart: 192.168.1.8:30082/eshtry-mny/eshtry-mny-cart@sha256:c2957607e51fb83ee6abf8211f81e66e68bca74226219fb79f8cab63566b886a
  frontend: 192.168.1.8:30082/eshtry-mny/eshtry-mny-frontend@sha256:31367080ff2d0c79434bb380f319fd2bb0482a2446fcc5cb76b43df2c60a6110
# ConfigMap values
mongoCluster: "" # unused when MONGO_URI is set (in-cluster MongoDB)
mongoDbname: "eshtry_mny"
frontendOrigin: "http://eshtry-mny.192.168.1.8.nip.io"
nodeEnv: "production"
# Local secrets backend (ADR D1). Values supplied out-of-band; never committed.
# `create` stays false for GitOps: Argo CD must not render/prune the Secrets,
# which are created out-of-band (bootstrap / Jenkins). See ci/scripts/create-secrets.sh.
secrets:
  create: false
  mongoUsername: ""
  mongoPassword: ""
  mongoUri: ""
  accessToken: ""
  harborUsername: ""
  harborPassword: ""
registry:
  host: "192.168.1.8:30082"
  pullSecretName: "harbor-creds"
# In-cluster MongoDB (ADR D7). No cloud database.
mongodb:
  enabled: true
  image: "mongo:7.0"
  storageClass: "local-path"
  storageSize: "2Gi"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
# External Secrets (AWS/Vault) are disabled for this homelab (ADR D1).
externalSecrets:
  enabled: false
# Right-sized for the homelab (docs/01-capacity-budget.md).
hpa:
  minReplicas: 1
  maxReplicas: 3
  cpuUtilization: 70
  memoryUtilization: 80
# PodDisruptionBudget: maxUnavailable keeps single-replica rollouts/drains possible.
pdb:
  maxUnavailable: 1
  # Image signature admission (Phase 5/8). Roll out Audit first, then Enforce.
kyverno:
  verifyImages:
    enabled: true
    action: Audit
# PostSync smoke test (Phase 10). Runs in its own namespace via the Ingress.
smokeTest:
  enabled: true
  image: "curlimages/curl:8.10.1"
  baseUrl: "http://eshtry-mny.192.168.1.8.nip.io"
# Observability via the existing kube-prometheus-stack.
monitoring:
  serviceMonitor:
    enabled: true
  dashboard:
    enabled: true
# ====================== Ingress ======================
ingress:
  enabled: true
  className: traefik
  host: eshtry-mny.192.168.1.8.nip.io
# Runtime UIDs matching the container images (ADR: numeric uid required for runAsNonRoot)
security:
  backend:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
  frontend:
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
  mongodb:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
