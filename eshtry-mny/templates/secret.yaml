{{- if not .Values.externalSecrets.enabled }}
# Local secrets backend for the homelab (ADR-0001 D1).
# Values come from an untracked values file / Jenkins credentials — never Git.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: eshtry-mny
  labels:
    app.kubernetes.io/part-of: eshtry-mny
    app.kubernetes.io/managed-by: helm
type: Opaque
stringData:
  MONGO_USERNAME: {{ .Values.secrets.mongoUsername | quote }}
  MONGO_PASSWORD: {{ .Values.secrets.mongoPassword | quote }}
  MONGO_URI: {{ .Values.secrets.mongoUri | quote }}
  ACCESS_TOKEN: {{ .Values.secrets.accessToken | quote }}
{{- end }}
