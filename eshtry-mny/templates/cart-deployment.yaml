apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: eshtry-mny
spec:
  # replicas intentionally omitted — owned by cart-service-hpa
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.security.backend.runAsUser }}
        runAsGroup: {{ .Values.security.backend.runAsGroup }}
        fsGroup: {{ .Values.security.backend.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: {{ .Values.registry.pullSecretName }}
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - cart-service
                topologyKey: kubernetes.io/hostname
      containers:
        - name: cart-service
          image: {{ .Values.images.cart }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 9003
          livenessProbe:
            httpGet:
              path: /health
              port: 9003
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 9003
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: app-secrets
            - configMapRef:
                name: app-config
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MONGO_URI_CART
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-keys
                  key: JWT_PUBLIC_KEY