{{- if .Values.secrets.harborUsername }}
# Pull-only credential for the private Harbor project (robot account).
# Populated from an untracked values file / Jenkins credentials.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.registry.pullSecretName }}
  namespace: eshtry-mny
  labels:
    app.kubernetes.io/part-of: eshtry-mny
    app.kubernetes.io/managed-by: helm
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"{{ .Values.registry.host }}":{"username":"{{ .Values.secrets.harborUsername }}","password":"{{ .Values.secrets.harborPassword }}","auth":"{{ printf "%s:%s" .Values.secrets.harborUsername .Values.secrets.harborPassword | b64enc }}"}}}
{{- end }}
