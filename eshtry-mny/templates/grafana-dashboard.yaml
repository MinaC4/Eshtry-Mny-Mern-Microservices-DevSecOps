{{- if .Values.monitoring.dashboard.enabled }}
# Detailed project dashboard. JSON lives in eshtry-mny/dashboards/eshtry-mny.json
# and is embedded by Helm. Picked up by the Grafana sidecar (grafana_dashboard=1, NAMESPACE=ALL).
apiVersion: v1
kind: ConfigMap
metadata:
  name: eshtry-mny-dashboard
  namespace: eshtry-mny
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: eshtry-mny
data:
  eshtry-mny.json: |-
{{ .Files.Get "dashboards/eshtry-mny.json" | indent 4 }}
{{- end }}
