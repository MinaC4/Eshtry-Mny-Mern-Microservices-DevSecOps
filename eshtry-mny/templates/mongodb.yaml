{{- if .Values.mongodb.enabled }}
# Dedicated in-cluster MongoDB for eshtry-mny only (ADR-0001 D7).
# Not exposed outside the namespace; reached by the three services on port 27017.
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: eshtry-mny
  labels:
    app: mongodb
    app.kubernetes.io/part-of: eshtry-mny
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: eshtry-mny
  labels:
    app: mongodb
    app.kubernetes.io/part-of: eshtry-mny
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.security.mongodb.runAsUser }}
        runAsGroup: {{ .Values.security.mongodb.runAsGroup }}
        fsGroup: {{ .Values.security.mongodb.fsGroup }}
      imagePullSecrets:
        - name: {{ .Values.registry.pullSecretName }}
      containers:
        - name: mongodb
          image: {{ .Values.mongodb.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - "--wiredTigerCacheSizeGB"
            - "0.25"
            - "--bind_ip_all"
          ports:
            - name: mongo
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MONGO_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MONGO_PASSWORD
            - name: MONGO_INITDB_DATABASE
              value: {{ .Values.mongoDbname | quote }}
          resources:
{{ toYaml .Values.mongodb.resources | indent 12 }}
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: configdb
              mountPath: /data/configdb
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: configdb
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.mongodb.storageClass }}
        resources:
          requests:
            storage: {{ .Values.mongodb.storageSize }}
{{- end }}
