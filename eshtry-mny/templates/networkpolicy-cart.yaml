apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cart-service-allow
  namespace: eshtry-mny
spec:
  podSelector:
    matchLabels:
      app: cart-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 9003
  egress:
    # DNS resolution (UDP + TCP port 53 to kube-system)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Product service (in-cluster)
    - to:
        - podSelector:
            matchLabels:
              app: product-service
      ports:
        - protocol: TCP
          port: 9000
    # MongoDB Atlas (external SaaS — allow to any IP on 27017)
        # MongoDB Atlas egress: intentionally broad (0.0.0.0/0) because Atlas
        # does not provide a fixed IP range. Accepted tradeoff per security review.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 27017
