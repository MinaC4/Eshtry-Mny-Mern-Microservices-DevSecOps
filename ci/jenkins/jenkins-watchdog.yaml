# Jenkins init self-healing watchdog.
#
# The Jenkins chart regenerates the `jenkins` ConfigMap on every Helm upgrade; if the
# generated apply_config.sh uses interactive `cp -i` or `--latest true`, the init
# container crash-loops and the whole CI goes down. This CronJob re-applies the safe
# substitutions and restarts the pod if it is crash-looping, so Jenkins self-heals.
#
# Scoped to the `jenkins` namespace. Remove with:
#   kubectl delete -f ci/jenkins/jenkins-watchdog.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-watchdog
  namespace: jenkins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-watchdog
  namespace: jenkins
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-watchdog
  namespace: jenkins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-watchdog
subjects:
  - kind: ServiceAccount
    name: jenkins-watchdog
    namespace: jenkins
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jenkins-watchdog
  namespace: jenkins
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: jenkins-watchdog
          restartPolicy: Never
          containers:
            - name: watchdog
              image: alpine/k8s:1.31.0
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  NS=jenkins; CM=jenkins; POD=jenkins-0
                  src=$(kubectl get cm "$CM" -n "$NS" -o jsonpath='{.data.apply_config\.sh}')
                  fixed=$(printf '%s' "$src" | sed \
                    -e 's#yes n | cp -i /usr/share/jenkins/ref/plugins/\* /var/jenkins_plugins/;#cp -f /usr/share/jenkins/ref/plugins/* /var/jenkins_plugins/;#' \
                    -e 's#cp -i /usr/share/jenkins/ref/plugins/\* /var/jenkins_plugins/;#cp -f /usr/share/jenkins/ref/plugins/* /var/jenkins_plugins/;#' \
                    -e 's#--latest true;#--latest false;#')
                  if [ "$src" != "$fixed" ]; then
                    kubectl get cm "$CM" -n "$NS" -o yaml | sed \
                      -e 's#yes n | cp -i /usr/share/jenkins/ref/plugins/\* /var/jenkins_plugins/;#cp -f /usr/share/jenkins/ref/plugins/* /var/jenkins_plugins/;#' \
                      -e 's#cp -i /usr/share/jenkins/ref/plugins/\* /var/jenkins_plugins/;#cp -f /usr/share/jenkins/ref/plugins/* /var/jenkins_plugins/;#' \
                      -e 's#--latest true;#--latest false;#' | kubectl apply -f -
                    echo "watchdog: configmap fixed; restarting $POD"
                    kubectl delete pod "$POD" -n "$NS" --ignore-not-found
                    exit 0
                  fi
                  reason=$(kubectl get pod "$POD" -n "$NS" -o jsonpath='{.status.initContainerStatuses[?(@.name=="init")].state.waiting.reason}' 2>/dev/null || true)
                  if [ "$reason" = "CrashLoopBackOff" ]; then
                    echo "watchdog: init crash-looping; restarting $POD"
                    kubectl delete pod "$POD" -n "$NS" --ignore-not-found
                  else
                    echo "watchdog: jenkins init config OK ($reason)"
                  fi
