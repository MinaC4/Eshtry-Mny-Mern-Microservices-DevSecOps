server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Use Kubernetes cluster DNS for service resolution
    resolver kube-dns.kube-system.svc.cluster.local valid=10s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' /api/v1/; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self';" always;

    location /api/v1/users {
        set $upstream_user http://user-service:9001;
        proxy_pass $upstream_user;
    }
    location /api/v1/filter {
        set $upstream_product http://product-service:9000;
        proxy_pass $upstream_product;
    }
    location /api/v1/products {
        set $upstream_product http://product-service:9000;
        proxy_pass $upstream_product;
    }
    location /api/v1/cart {
        set $upstream_cart http://cart-service:9003;
        proxy_pass $upstream_cart;
    }
    location / {
        try_files $uri /index.html;
    }
}
