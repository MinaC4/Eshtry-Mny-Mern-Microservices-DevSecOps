title = "eshtry-mny gitleaks config"

# Without `useDefault = true` this file REPLACES gitleaks' built-in rule set,
# which would silently turn the secret scan into a no-op. Keep it true.
[extend]
useDefault = true

# Allowlist is intentionally tiny and path-based only. Both entries are
# git-ignored local secret files and must never be committed (see .gitignore).
# Add a narrow regex only after confirming a false positive.
[allowlist]
description = "Local-only, git-ignored secret files."
paths = [
  '''values-secret\.yaml$''',
  '''\.env$''',
]
